name: Auto Daily Commit

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  commit:
    name: Auto commit & push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 2700)) # Trễ ngẫu nhiên từ 0 - 45 phút cho tự nhiên

      - name: Configure git
        run: |
          git config user.name "yungpain404"
          git config user.email "nguyenngochau092@gmail.com"

      - name: Update file & Commit
        run: |
          # 1. Tạo thay đổi thực tế vào file hidden hoặc log để Git nhận diện
          echo "Last sync: $(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')" > .sync-status

          # 2. Danh sách message tự nhiên như dev hay gõ tay
          MESSAGES=(
            "docs: update project notes"
            "chore: sync local environment config"
            "refactor: clean up unused assets"
            "docs: revise setup instructions"
            "chore: update build metadata"
            "style: minor formatting adjustments"
            "docs: add progress tracking note"
          )
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add .sync-status
          git commit -m "$RANDOM_MSG"

      - name: Push changes
        run: git push origin HEAD:main
