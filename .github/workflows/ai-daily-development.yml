name: AI Daily Development

on:
  schedule:
    - cron: '0 13 * * *'   # 20:00 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  develop:
    name: Develop
    runs-on: ubuntu-latest
    outputs:
      patch: ${{ steps.develop.outputs.patch }}
      report: ${{ steps.develop.outputs.report }}
      has_changes: ${{ steps.develop.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm ci

      - name: Chạy AI developer agent
        id: develop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/ai-developer.mjs

      - name: Tải artifacts patch và báo cáo
        if: steps.develop.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-patch-${{ github.run_id }}
          path: |
            patch.diff
          retention-days: 1

  publish:
    name: Publish
    needs: develop
    if: needs.develop.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tải artifact patch
        uses: actions/download-artifact@v4
        with:
          name: ai-patch-${{ github.run_id }}

      - name: Áp dụng patch
        run: |
          git apply patch.diff || true

      - name: Commit changes
        run: |
          git config user.name "HGames AI Developer"
          git config user.email "ai@hgames.local"
          git add -A
          git commit -m "feat(ai): apply autonomous development patch" || echo "nothing to commit"

      - name: Create branch and push
        run: |
          BRANCH="ai/dev/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

      - name: Create draft Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/dev/${{ github.run_id }}
          title: "AI: autonomous development patch"
          body: |
            ${{ needs.develop.outputs.report }}
          draft: true
